name: Verify independent modules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: servicekit_test
          MYSQL_USER: servicekit
          MYSQL_PASSWORD: local-test-only
          MYSQL_ROOT_PASSWORD: local-root-test-only
        ports: ['3310:3306']
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=2s --health-timeout=2s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: servicekit_test
          POSTGRES_USER: servicekit
          POSTGRES_PASSWORD: local-test-only
        ports: ['5433:5432']
        options: --health-cmd="pg_isready -U servicekit -d servicekit_test" --health-interval=2s --health-timeout=2s --health-retries=30
    env:
      SERVICEKIT_TEST_DATABASE_URL: mysql://servicekit:local-test-only@127.0.0.1:3310/servicekit_test
      SERVICEKIT_TEST_POSTGRES_URL: postgres://servicekit:local-test-only@127.0.0.1:5433/servicekit_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.13.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential libmariadb-dev libssl-dev unzip
      - run: bash scripts/install-moon.sh && npm run moon -- update
      - run: npm run moon -- fmt && npm run check
      - run: git diff --exit-code
      - run: npm test
      - run: npm run test:consumer
      - run: npm run test:databases
      - run: npm run test:packages
