services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: servicekit_test
      MYSQL_USER: servicekit
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-root-test-only
    ports:
      - '127.0.0.1:3310:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 2s
      timeout: 2s
      retries: 30
