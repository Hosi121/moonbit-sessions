services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: servicekit_test
      MYSQL_USER: servicekit
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-root-test-only
    ports:
      - '127.0.0.1:3310:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: servicekit_test
      POSTGRES_USER: servicekit
      POSTGRES_PASSWORD: local-test-only
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servicekit -d servicekit_test']
      interval: 2s
      timeout: 2s
      retries: 30
